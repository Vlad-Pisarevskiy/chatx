<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пользователи</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-columns: 280px 1fr;
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #201e1d;
    background: #f3f2f2;
  }

  aside {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #fff;
    border-right: 1px solid #c9c7c7;
  }

  aside header { padding: 16px; border-bottom: 1px solid #e4e2e2; }
  aside h1 { margin: 0; font-size: 18px; }
  .me { margin: 4px 0 0; font-size: 13px; color: #6b6867; }

  #users { flex: 1; margin: 0; padding: 0; overflow-y: auto; list-style: none; }
  #users li { border-bottom: 1px solid #f0eeee; }

  .user {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    padding: 12px 16px;
    font: inherit;
    text-align: left;
    background: none;
    border: 0;
    cursor: pointer;
  }
  .user:hover { background: #f7f6f6; }
  .user.active { background: #e6f4f8; box-shadow: inset 3px 0 0 #0088b0; }

  .name { font-weight: 500; }
  .login { font-size: 13px; color: #6b6867; }

  .unread {
    width: 8px;
    height: 8px;
    margin-left: auto;
    background: #c2334d;
    border-radius: 50%;
  }

  .empty { padding: 16px; font-size: 14px; color: #6b6867; }

  .chat { display: flex; flex-direction: column; min-height: 0; }

  .chat header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    background: #fff;
    border-bottom: 1px solid #c9c7c7;
  }
  .chat h2 { margin: 0; font-size: 18px; }

  #status { margin-left: auto; font-size: 13px; color: #6b6867; }
  #status[data-live] { color: #2e7d4f; }
  #status a { color: #0088b0; }

  #logout {
    padding: 6px 12px;
    font: inherit;
    font-size: 14px;
    color: #201e1d;
    background: #fff;
    border: 1px solid #c9c7c7;
    border-radius: 2px;
    cursor: pointer;
  }
  #logout:hover { background: #f7f6f6; }
  #logout:disabled { color: #6b6867; cursor: default; }

  #messages {
    flex: 1;
    margin: 0;
    padding: 16px;
    overflow-y: auto;
    list-style: none;
  }

  .msg {
    max-width: 60%;
    margin-bottom: 8px;
    padding: 8px 12px;
    border-radius: 10px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .msg.mine { margin-left: auto; color: #fff; background: #0088b0; }
  .msg.theirs { background: #fff; border: 1px solid #e4e2e2; }
  .msg.sending { opacity: .55; }
  .msg.system {
    max-width: none;
    margin: 8px 0;
    padding: 0;
    font-size: 13px;
    color: #6b6867;
    text-align: center;
  }

  #placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 16px;
    color: #6b6867;
  }

  form {
    display: flex;
    gap: 8px;
    padding: 16px;
    background: #fff;
    border-top: 1px solid #c9c7c7;
  }

  input {
    flex: 1;
    padding: 10px;
    font: inherit;
    background: #fff;
    border: 1px solid #c9c7c7;
    border-radius: 2px;
  }
  input:focus-visible { border-color: #0088b0; outline: 1px solid #0088b0; }

  button[type="submit"] {
    padding: 10px 20px;
    font: inherit;
    color: #fff;
    background: #0088b0;
    border: 0;
    border-radius: 2px;
    cursor: pointer;
  }
  [hidden] {
    display: none !important;
  }
</style>
</head>
<body>

<aside>
  <header>
    <header>
      <h1>Пользователи</h1>

      {{if .Me}}
      <p class="me">Вы вошли как {{.Me}}</p>
      {{end}}

      <script>
        const myUserId = {{.MyID}};
      </script>
    </header>
  </header>

  <ul id="users">
    {{range .Users}}
    <li>
      <button type="button" class="user" data-id="{{.ID}}" data-name="{{.Name}}">
        <span class="name">{{.Name}}</span>
        <span class="login">{{.Login}}</span>
        <span class="unread" hidden></span>
      </button>
    </li>
    {{else}}
    <li class="empty">Кроме вас пока никто не зарегистрирован</li>
    {{end}}
  </ul>
</aside>

<section class="chat">
  <header>
    <h2 id="peer">Выберите собеседника</h2>
    <span id="status">соединение…</span>
    <button type="button" id="logout">Выйти из аккаунта</button>
  </header>

  <ol id="messages" hidden></ol>
  <p id="placeholder">Выберите человека слева, чтобы написать ему</p>

  <form id="form" hidden>
    <input id="text" type="text" placeholder="Сообщение" autocomplete="off" required>
    <button type="submit">Отправить</button>
  </form>
</section>

<script>
"use strict";

const usersEl = document.getElementById("users");
const messagesEl = document.getElementById("messages");
const placeholderEl = document.getElementById("placeholder");
const formEl = document.getElementById("form");
const textEl = document.getElementById("text");
const peerEl = document.getElementById("peer");
const statusEl = document.getElementById("status");
const logoutEl = document.getElementById("logout");

// peerId (строка) -> массив реплик. Лента живёт в памяти вкладки; историю
// подтягиваем с сервера при открытии переписки.
const history = new Map();

// Слева список пользователей, а адресуется всё по чатам — держим связку в обе стороны.
const chatIdByPeer = new Map();   // peerId (строка) -> chatId (число)
const peerIdByChat = new Map();   // chatId (число)  -> peerId (строка)

// client_msg_id -> ещё не подтверждённое сообщение, ждёт ack.
const pending = new Map();

// Серверные id всего, что уже нарисовано: по ним отбрасываются дубли между
// историей, эхом собственного сообщения и ack.
const seenMessageIds = new Set();

let currentPeerId = null;
let currentChatId = null;
let socket = null;
let reconnectDelay = 1000;
let everConnected = false;
let failedAttempts = 0;
let loggedOut = false;

// --- выбор собеседника ---

usersEl.addEventListener("click", (event) => {
  const button = event.target.closest(".user");
  if (button) selectUser(button.dataset.id, button.dataset.name);
});

async function selectUser(peerId, name) {
  currentPeerId = peerId;
  currentChatId = null;
  peerEl.textContent = name;

  for (const button of usersEl.querySelectorAll(".user")) {
    const active = button.dataset.id === peerId;
    button.classList.toggle("active", active);

    if (active) {
      button.querySelector(".unread").hidden = true;
    }
  }

  placeholderEl.hidden = true;
  messagesEl.hidden = false;
  formEl.hidden = false;

  messagesEl.replaceChildren();
  textEl.focus();

  // Клик — операция только на чтение. Спрашиваем, есть ли уже чат с этим
  // человеком, и ничего не создаём: иначе база забивалась бы пустыми чатами
  // от одного лишь просмотра списка.
  let chatId = null;
  try {
    chatId = await resolveChat(peerId);
  } catch (err) {
    console.error(err);
    note("Не удалось открыть переписку");
    return;
  }

  // Пока шёл запрос, могли кликнуть по другому человеку — ответ уже не наш.
  if (currentPeerId !== peerId) return;

  currentChatId = chatId;

  // chatId === null значит, что переписки ещё не было. Это не ошибка: лента
  // пустая, чат появится в базе при отправке первого сообщения.
  if (chatId === null) {
    renderHistory(peerId);
    return;
  }

  await loadMessages(chatId, peerId);
}

// --- чаты ---

// Поиск чата, без создания. 404 — переписки не было, это штатный ответ.
async function resolveChat(peerId) {
  const known = chatIdByPeer.get(peerId);
  if (known !== undefined) return known;

  const response = await fetch("/chats/direct?peer_id=" + encodeURIComponent(peerId));

  if (response.status === 404) return null;
  if (!response.ok) throw new Error("resolveChat: " + response.status);

  const payload = await response.json();
  bindChat(payload.chat_id, peerId);
  return payload.chat_id;
}

// get-or-create. Если чат успели создать параллельно (собеседник написал
// первым в ту же секунду), ручка обязана вернуть существующий id, а не завести
// второй чат на ту же пару — иначе переписка расползётся по двум лентам.
async function createChat(peerId) {
  const response = await fetch("/chats/direct", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ peer_id: Number(peerId) }),
  });

  if (!response.ok) throw new Error("createChat: " + response.status);

  const payload = await response.json();
  bindChat(payload.chat_id, peerId);
  return payload.chat_id;
}

function bindChat(chatId, peerId) {
  chatIdByPeer.set(peerId, chatId);
  peerIdByChat.set(chatId, peerId);
}

// --- лента ---

function bubble(message) {
  const li = document.createElement("li");
  li.className = "msg " + message.kind + (message.state === "sending" ? " sending" : "");
  li.textContent = message.text; // textContent, а не innerHTML: текст приходит от другого пользователя

  // По этому атрибуту ack находит нарисованный пузырь и снимает с него «отправляется».
  if (message.clientMsgId) li.dataset.cmid = message.clientMsgId;

  return li;
}

function scrollDown() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderHistory(peerId) {
  messagesEl.replaceChildren();
  for (const message of history.get(peerId) || []) {
    messagesEl.append(bubble(message));
  }
  scrollDown();
}

function push(peerId, message) {
  if (!history.has(peerId)) history.set(peerId, []);
  history.get(peerId).push(message);

  if (peerId === currentPeerId) {
    messagesEl.append(bubble(message));
    scrollDown();
    return;
  }

  const button = usersEl.querySelector('.user[data-id="' + CSS.escape(peerId) + '"]');
  if (button) button.querySelector(".unread").hidden = false;
}

function note(text) {
  if (currentPeerId) push(currentPeerId, { kind: "system", text: text });
}

// --- сокет ---

function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  // Именно "/ws/" со слэшем: маршрут объявлен как ws.GET("/"), а на "/ws" gin ответит
  // редиректом — обычный запрос он бы дослал, но WebSocket-хендшейк редирект не переживает.
  socket = new WebSocket(scheme + "://" + location.host + "/ws/");

  socket.addEventListener("open", () => {
    everConnected = true;
    failedAttempts = 0;
    reconnectDelay = 1000;
    setStatus("на связи", true);
  });

  socket.addEventListener("message", (event) => receive(event.data));

  socket.addEventListener("error", () => socket.close());

  socket.addEventListener("close", () => {
    // Вышли сами — переподключаться и пугать пользователя «нет связи» не надо.
    if (loggedOut) return;

    failedAttempts += 1;

    // Ни одного успешного соединения — почти наверняка мидлвэйр не пустил: куки нет или истекла.
    if (!everConnected && failedAttempts >= 3) {
      statusEl.removeAttribute("data-live");
      statusEl.replaceChildren("сессия истекла — ");
      const link = document.createElement("a");
      link.href = "/login";
      link.textContent = "войти заново";
      statusEl.append(link);
      return;
    }

    setStatus("нет связи, переподключаюсь…", false);
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 15000);
  });
}

function setStatus(text, live) {
  statusEl.textContent = text;
  if (live) statusEl.dataset.live = "";
  else statusEl.removeAttribute("data-live");
}

// Оба направления ходят одним конвертом {type, payload}.
function receive(raw) {
  const frame = tryParse(raw);
  if (!frame || typeof frame.type !== "string") return;

  const payload = frame.payload || {};

  if (frame.type === "message") onMessage(payload);
  else if (frame.type === "ack") onAck(payload);
  else if (frame.type === "error") note(payload.description || "ошибка сервера");
}

function onMessage(payload) {
  // Своё сообщение приходит дважды: как ack на этом соединении и как message
  // (сервер рассылает всем участникам чата, отправитель — тоже участник).
  // Дедуплицируем по серверному id, он единственный общий для обеих копий.
  if (seenMessageIds.has(payload.message_id)) return;
  seenMessageIds.add(payload.message_id);

  let peerId = peerIdByChat.get(payload.chat_id);

  // Чат нам незнаком — значит, собеседник написал первым, а мы на него не кликали.
  // В личном чате отправитель и есть собеседник, так что связку узнаём отсюда.
  if (peerId === undefined) {
    if (Number(payload.sender_id) === Number(myUserId)) return;
    peerId = String(payload.sender_id);
    bindChat(payload.chat_id, peerId);
  }

  const kind = Number(payload.sender_id) === Number(myUserId) ? "mine" : "theirs";
  push(peerId, { kind: kind, text: payload.body });
}

function onAck(payload) {
  // Серверный id запоминаем до того, как придёт эхо этого же сообщения.
  seenMessageIds.add(payload.message_id);

  const message = pending.get(payload.client_msg_id);
  if (!message) return;
  pending.delete(payload.client_msg_id);

  message.state = "sent";

  const el = messagesEl.querySelector('[data-cmid="' + CSS.escape(payload.client_msg_id) + '"]');
  if (el) el.classList.remove("sending");
}

function tryParse(raw) {
  try {
    const value = JSON.parse(raw);
    return value && typeof value === "object" ? value : null;
  } catch {
    return null;
  }
}

// --- отправка ---

formEl.addEventListener("submit", async (event) => {
  event.preventDefault();

  const text = textEl.value.trim();
  if (!text || !currentPeerId) return;

  if (!socket || socket.readyState !== WebSocket.OPEN) {
    note("Нет связи с сервером, сообщение не отправлено");
    return;
  }

  // Запоминаем, кому пишем: пока создаётся чат, пользователь может уйти в другую переписку.
  const peerId = currentPeerId;

  textEl.value = "";
  textEl.focus();

  // Вот здесь и только здесь чат заводится в базе — на первом реальном
  // сообщении. Дальше id уже известен и вторая отправка идёт сразу в сокет.
  let chatId = chatIdByPeer.get(peerId);
  if (chatId === undefined) {
    try {
      chatId = await createChat(peerId);
    } catch (err) {
      console.error(err);
      note("Не удалось начать чат, сообщение не отправлено");
      return;
    }
    if (currentPeerId === peerId) currentChatId = chatId;
  }

  // Уникален между перезагрузками вкладки: счётчик после F5 начался бы заново,
  // сервер счёл бы новое сообщение ретраем старого и молча его потерял.
  const clientMsgId = crypto.randomUUID();

  const message = { kind: "mine", text: text, state: "sending", clientMsgId: clientMsgId };
  pending.set(clientMsgId, message);
  push(peerId, message);

  // from не шлём: отправителя сервер знает сам из токена, клиенту тут верить нельзя.
  socket.send(JSON.stringify({
    type: "send",
    payload: { chat_id: chatId, body: text, client_msg_id: clientMsgId },
  }));
});

connect();

// --- выход из аккаунта ---

logoutEl.addEventListener("click", async () => {
  logoutEl.disabled = true;

  // Кука httpOnly, из JS её не удалить — гасить сессию обязан сервер.
  // Пока ручка не ответила OK, никуда не уходим: иначе покажем «вы вышли»,
  // а токен останется живым.
  try {
    const response = await fetch("/auth/logout", { method: "POST" });
    if (!response.ok) throw new Error("logout: " + response.status);
  } catch (err) {
    console.error(err);
    logoutEl.disabled = false;
    setStatus("не удалось выйти", false);
    return;
  }

  loggedOut = true;
  if (socket) socket.close();

  // replace, а не href: назад по истории вкладки в чат уже не вернуться.
  location.replace("/login");
});

// История сообщений
async function loadMessages(chatId, peerId) {
  try {
    const response = await fetch("/chats/" + chatId + "/messages");

    if (!response.ok) {
      throw new Error("Не удалось загрузить сообщения");
    }

    const messages = await response.json();

    history.set(peerId, messages.map((message) => {
      // Тот же id, что и в live-потоке: сообщение, пришедшее между запросом
      // истории и её отрисовкой, придёт дважды и будет отброшено по нему.
      seenMessageIds.add(message.message_id);

      return {
        kind: Number(message.sender_id) === Number(myUserId) ? "mine" : "theirs",
        text: message.body,
      };
    }));

    if (currentPeerId !== peerId) return;

    renderHistory(peerId);

  } catch (err) {
    console.error(err);
  }
}
</script>

</body>
</html>
